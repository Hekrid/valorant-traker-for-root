<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Valorant Tracker mark: a crosshair around rising stat bars. Original art, no Riot logos. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2733"/>
      <stop offset="1" stop-color="#0f141b"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d93a48"/>
      <stop offset="1" stop-color="#ff5a67"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- crosshair: four arcs with gaps where the ticks are -->
  <g fill="none" stroke="#ff4655" stroke-width="3.2" stroke-linecap="round">
    <path d="M38.67 13.68A19.5 19.5 0 0 1 50.32 25.33"/>
    <path d="M38.67 13.68A19.5 19.5 0 0 1 50.32 25.33" transform="rotate(90 32 32)"/>
    <path d="M38.67 13.68A19.5 19.5 0 0 1 50.32 25.33" transform="rotate(180 32 32)"/>
    <path d="M38.67 13.68A19.5 19.5 0 0 1 50.32 25.33" transform="rotate(270 32 32)"/>
  </g>
  <g stroke="#ff4655" stroke-width="3.2" stroke-linecap="round">
    <path d="M32 6v8"/><path d="M58 32h-8"/><path d="M32 58v-8"/><path d="M6 32h8"/>
  </g>
  <!-- rising bars -->
  <rect x="22" y="34" width="5.5" height="9" rx="1.6" fill="#e8ecf2" opacity=".55"/>
  <rect x="29.25" y="28" width="5.5" height="15" rx="1.6" fill="#e8ecf2" opacity=".8"/>
  <rect x="36.5" y="21" width="5.5" height="22" rx="1.6" fill="url(#red)"/>
</svg>
